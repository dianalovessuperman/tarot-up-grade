<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таро Обитель: Испытание Арканов</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0f0c1b;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #app-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 850px;
            background: #18142a;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .screen {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 20px;
            overflow-y: auto;
            position: absolute;
            top: 0; left: 0;
            background: #18142a;
        }
        .active-screen { display: flex !important; z-index: 2; }
        
        /* Buttons & Utility */
        button {
            cursor: pointer;
            border: none;
            outline: none;
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        .btn-main {
            background: linear-gradient(135deg, #7b2cbf, #9d4edd);
            color: #fff;
            padding: 12px 20px;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn-choice {
            background: #282142;
            color: #d1c4e9;
            border: 1px solid #4a3b69;
            padding: 12px;
            margin: 6px 0;
            text-align: left;
            width: 100%;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4;
        }
        .btn-choice:hover { background: #3c3161; border-color: #9d4edd; }

        /* Map Tree */
        #map-tree { display: flex; flex-direction: column; align-items: center; margin: 15px 0; }
        .path-node {
            width: 50px; height: 50px;
            border-radius: 50%;
            background: #3c3161;
            color: #d1c4e9;
            display: flex; justify-content: center; align-items: center;
            font-weight: bold;
            border: 2px solid #7b2cbf;
            position: relative;
            cursor: pointer;
        }
        .path-node.locked { background: #1f1a30; border-color: #382d54; color: #554a70; cursor: not-allowed; }
        .node-label { position: absolute; left: 65px; white-space: nowrap; font-size: 14px; color: #c4b5fd; }
        .node-separator { width: 2px; height: 25px; background: #4a3b69; margin: 4px 0; }

        /* Navigation Bar */
        .bottom-nav {
            position: absolute; bottom: 0; left: 0; width: 100%;
            height: 60px; background: #120e22;
            display: flex; justify-content: space-around; align-items: center;
            border-top: 1px solid #2d2447; z-index: 10;
        }
        .btn-nav-mode { background: transparent; color: #8b7ca8; font-size: 12px; }
        .btn-nav-mode.active { color: #c4b5fd; font-weight: bold; }

        /* Grid */
        .cards-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 10px; }
        .arcanum-card { background: #231b3b; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid #3c3161; cursor: pointer; }
        .arcanum-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 4px; }
        .arcanum-num-tag { font-size: 11px; color: #9d4edd; margin-top: 4px; }

        /* Modal */
        #custom-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 100;
        }
        .modal-content { background: #1e1833; padding: 20px; border-radius: 12px; max-width: 320px; text-align: center; border: 1px solid #7b2cbf; }
    </style>
</head>
<body>

<div id="app-container">

    <!-- Loading Screen -->
    <div id="loading-screen" class="screen active-screen" style="justify-content: center; align-items: center;">
        <h2 style="color: #c4b5fd; margin-bottom: 10px;">Таро Обитель</h2>
        <p style="color: #8b7ca8;">Загрузка испытаний...</p>
    </div>

    <!-- Menu / Map Screen -->
    <div id="menu-screen" class="screen" style="padding-bottom: 70px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>Древо Пути</h3>
            <div>Сила: <span id="xp-count" style="color:#9d4edd; font-weight:bold;">0</span></div>
        </div>
        <p id="cat-menu-text" style="font-size: 13px; color: #a799c7; margin: 10px 0; background: #231b3b; padding: 10px; border-radius: 6px;">
            «Выбери доступный Аркан для прохождения испытания.»
        </p>
        <div id="map-tree"></div>
    </div>

    <!-- Arcanum Gallery Screen -->
    <div id="arcanum-screen" class="screen" style="padding-bottom: 70px;">
        <h3>Галерея Арканов</h3>
        <div id="cards-grid-container" class="cards-grid"></div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen">
        <div id="level-badge" style="color: #9d4edd; font-size: 12px; font-weight: bold;"></div>
        <h3 id="level-title" style="margin: 5px 0 10px 0;"></h3>
        <img id="level-image" src="" alt="" style="width: 100%; height: 140px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; display: none;">
        <p id="level-text" style="font-size: 14px; line-height: 1.5; color: #d1c4e9; margin-bottom: 15px;"></p>
        <div id="options-container"></div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <button class="btn-nav-mode active" onclick="switchMode('menu-screen')">Карта Пути</button>
        <button class="btn-nav-mode" onclick="switchMode('arcanum-screen')">Арканы</button>
    </div>

    <!-- Modal Window -->
    <div id="custom-modal">
        <div class="modal-content">
            <h4 id="modal-title" style="color: #c4b5fd; margin-bottom: 10px;"></h4>
            <img id="modal-image" src="" alt="" style="max-height: 80px; border-radius: 4px; display: none; margin-bottom: 10px;">
            <p id="modal-text" style="font-size: 13px; color: #d1c4e9; margin-bottom: 15px;"></p>
            <button class="btn-main" onclick="closeModal()">Продолжить</button>
        </div>
    </div>

</div>

<script>
    const quests = [
        {
            id: 0, num: "XVI", name: "Башня: Крах Иллюзий", title: "Запрос Силы: Разрушение Башни", image: "tower.png", unlocked: true,
            text: "К твоему алтарю обратилась женщина. Её семейный союз сгорел из-за предательства. Что ты передашь её душе?",
            choices: [
                { key: "A", text: "Пытаться удержать осколки и склеить брак любой ценой.", isCorrect: false, msg: "❌ Неверно. Удерживать падающую Башню — значит погрести себя под обломками." },
                { key: "B", text: "Принять, что всё кончено навсегда, смириться с вечной пустотой.", isCorrect: false, msg: "⚠️ Не совсем. Башня — это не тупик, а расчистка места для нового." },
                { key: "C", text: "Это болезненный, но спасительный крах лжи. На очищенном фундаменте она воздвигнет истинную жизнь.", isCorrect: true, msg: "🔥 Безупречно! Башня убрала то, что мешало росту. +15 к Силе!" }
            ]
        },
        {
            id: 1, num: "VI", name: "Влюбленные: Выбор", title: "Запрос Силы: Выбор Влюбленных", image: "love.png", unlocked: false,
            text: "Перед тобой женщина 35 лет. У нее стабильная работа, но душа увядает — мечтает о студии флористики, но боится. В чем урок?",
            choices: [
                { key: "A", text: "Остаться в банке, а цветы оставить как хобби по выходным.", isCorrect: false, msg: "❌ Это выбор из страха, а не из сердца." },
                { key: "B", text: "Сделать тотальный Выбор Сердца. Отказаться от чужого сценария и пойти в свою реализацию.", isCorrect: true, msg: "💖 Прекрасно! Влюбленные — это глобальный выбор своего истинного пути. +15 к Силе!" },
                { key: "C", text: "Ждать идеального знака от судьбы или пока её уволят.", isCorrect: false, msg: "⚠️ Перекладывание выбора на обстоятельства — отказ от силы Аркана." }
            ]
        },
        {
            id: 2, num: "VII", name: "Колесница: Воля", title: "Запрос Силы: Триумф Колесницы", image: "chariot.png", unlocked: false,
            text: "Руководитель выгорел: пашет 24/7 ради должности, прессует команду, но проект буксует. В чём его ошибка?",
            choices: [
                { key: "A", text: "Увеличить давление, штрафовать за ошибки и лично контролировать каждую мелочь.", isCorrect: false, msg: "❌ Гиперконтроль приведет к аварии Колесницы." },
                { key: "B", text: "Ослабить слепой напор. Навести баланс между дисциплиной и мотивацией команды.", isCorrect: true, msg: "🎯 Безупречно! Колесничий побеждает балансом противоположностей. +15 к Силе!" },
                { key: "C", text: "Признать команду безнадежной и сделать всё самому.", isCorrect: false, msg: "⚠️ Это путь к саморазрушению." }
            ]
        },
        {
            id: 3, num: "0", name: "Дурак: Прыжок веры", title: "Запрос Силы: Обнуление Дурака", image: "fool.png", unlocked: false,
            text: "Топ-менеджер мечтает о своем деле, но боится потерять статус и стать «никем». Чему его научит Дурак?",
            choices: [
                { key: "A", text: "Держаться за стабильное место, статус важнее туманных амбиций.", isCorrect: false, msg: "❌ Выбор из страха эго. Золотая клетка остается клеткой." },
                { key: "B", text: "Ждать, пока накопится сумма, полностью исключающая риски.", isCorrect: false, msg: "⚠️ Иллюзия. Идеального момента со 100% гарантией не существует." },
                { key: "C", text: "Снять маску регалий, согласиться на время стать новичком и совершить смелый прыжок.", isCorrect: true, msg: "✨ Потрясающе! Дурак требует сбросить важность эго и начать с чистым сердцем. +15 к Силе!" }
            ]
        },
        {
            id: 4, num: "XVIII", name: "Луна: Тайны Тени", title: "Запрос Силы: Сумерки Луны", image: "moon.png", unlocked: false,
            text: "Мужчина успешен, но внутри глухая тревога и кризис смыслов. Он глушит это экстримом и алкоголем. Как пройти туман?",
            choices: [
                { key: "A", text: "Сцепить зубы, игнорировать слабость и продолжать доказывать всем силу.", isCorrect: false, msg: "❌ Отрицание Луны приводит к тяжелым срывам." },
                { key: "B", text: "Посмотреть вглубь себя, честно признать кризис и пройти сквозь страх к новым смыслам.", isCorrect: true, msg: "🔮 Ошеломительно! Пройти Луну — значит приручить своих внутренних волков. +15 к Силе!" },
                { key: "C", text: "Сменить обстановку: бросить семью или улететь на острова.", isCorrect: false, msg: "⚠️ Бегство не поможет, тень последует за тобой." }
            ]
        },
        {
            id: 5, num: "IV", name: "Император: Опора Власти", title: "Запрос Силы: Трон Императора", image: "emperor.png", unlocked: false,
            text: "Основатель бизнеса страдает от хаоса в процессах и падения прибыли, но хочет «былой свободы». В чем его ошибка?",
            choices: [
                { key: "A", text: "Свобода без структуры превращается в хаос. Нужно установить регламенты и взять ответственность.", isCorrect: true, msg: "👑 Абсолютно верно! Структура дает истинную опору для масштаба! +20 к Силе!" },
                { key: "B", text: "Уволить бунтарей и лично продавливать решения своей харизмой.", isCorrect: false, msg: "❌ Ловушка самодурства. Попытка ручного управления разрушит систему." },
                { key: "C", text: "Делегировать все дела и полностью отстраниться.", isCorrect: false, msg: "⚠️ Потеря контроля над базисом ведет к потере трона." }
            ]
        },
        {
            id: 6, num: "VIII", name: "Сила: Кроткий Зверь", title: "Запрос Силы: Приручение Льва", image: "strength.png", unlocked: false,
            text: "Мать пытается укротить дерзкого подростка наказаниями и давлением, но получает лишь агрессию. В чем ключ?",
            choices: [
                { key: "A", text: "Усилить давление. Лев должен знать, кто в доме хозяин.", isCorrect: false, msg: "❌ Сила — это не про насилие. Грубое давление лишь порождает сопротивление." },
                { key: "B", text: "Смягчить хватку и укротить «зверя» принятием, милосердием и мудрой нежностью.", isCorrect: true, msg: "🦁 Великое откровение! Высшая сила кроется в душевном благородстве и доверии. +20 к Силе!" },
                { key: "C", text: "Смириться и полностью предоставить подростка самому себе.", isCorrect: false, msg: "⚠️ Это равнодушие, а не Сила." }
            ]
        },
        {
            id: 7, num: "IX", name: "Отшельник: Свет Внутри", title: "Запрос Силы: Фонарь Мудрости", image: "hermit.png", unlocked: false,
            text: "Человек достиг всех внешних целей, но ощутил одиночество и пустоту. Каков истинный совет Отшельника?",
            choices: [
                { key: "A", text: "Прислушаться к друзьям: чаще выходить в свет и отвлекаться шумными компаниями.", isCorrect: false, msg: "❌ Попытка заглушить голод внешним шумом лишь усугубит пустоту." },
                { key: "B", text: "Заизолироваться от мира навсегда и уехать жить в глушь.", isCorrect: false, msg: "⚠️ Бегство из обиды — теневая сторона карты." },
                { key: "C", text: "Принять тишину, замедлиться и зажечь внутренний фонарь, чтобы переосмыслить ценности.", isCorrect: true, msg: "🕯️ Превосходно! Отшельник ищет свет, чтобы принести его людям. Все испытания пройдены! +25 к Силе!" }
            ]
        }
    ];

    const arcanumData = [
        { num: "0", name: "Дурак", image: "fool.png", desc: "Аркан начала и чистого листа. Символизирует смелость шагнуть в неизвестность." },
        { num: "IV", name: "Император", image: "emperor.png", desc: "Аркан структуры, дисциплины и ответственности. Наводит порядок в хаосе." },
        { num: "VI", name: "Влюбленные", image: "love.png", desc: "Аркан выбора сердца и душевной гармонии." },
        { num: "VII", name: "Колесница", image: "chariot.png", desc: "Аркан триумфа воли и баланса противоположностей." },
        { num: "VIII", name: "Сила", image: "strength.png", desc: "Аркан мягкой душевной стойкости, милосердия и принятия." },
        { num: "IX", name: "Отшельник", image: "hermit.png", desc: "Аркан поисков внутреннего света и переосмысления ценностей." },
        { num: "XVI", name: "Башня", image: "tower.png", desc: "Аркан крушения иллюзий и очищения фундамента." },
        { num: "XVIII", name: "Луна", image: "moon.png", desc: "Аркан подсознания, работы с Тенью и интуиции." }
    ];

    let userXP = 0;
    let currentQuestId = 0;
    let pendingNextQuest = null;

    // Безопасный запуск после загрузки DOM
    document.addEventListener("DOMContentLoaded", function() {
        renderMapTree();
        renderArcanumGrid();

        setTimeout(() => {
            const loadScreen = document.getElementById('loading-screen');
            if (loadScreen) {
                loadScreen.style.transition = 'opacity 0.6s ease';
                loadScreen.style.opacity = '0';
                setTimeout(() => {
                    loadScreen.classList.remove('active-screen');
                    document.getElementById('menu-screen').classList.add('active-screen');
                }, 600);
            }
        }, 1200);
    });

    function switchMode(targetScreenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        const target = document.getElementById(targetScreenId);
        if (target) target.classList.add('active-screen');

        document.querySelectorAll('.btn-nav-mode').forEach(btn => btn.classList.remove('active'));
        if (targetScreenId === 'menu-screen') document.querySelectorAll('.btn-nav-mode')[0].classList.add('active');
        if (targetScreenId === 'arcanum-screen') document.querySelectorAll('.btn-nav-mode')[1].classList.add('active');
    }

    function renderMapTree() {
        const container = document.getElementById('map-tree');
        if (!container) return;
        container.innerHTML = '';

        quests.forEach((q, index) => {
            const node = document.createElement('div');
            node.className = `path-node ${q.unlocked ? '' : 'locked'}`;
            
            if (q.unlocked) {
                node.innerText = q.num;
                node.onclick = () => startQuest(q.id);
            } else {
                node.innerText = '🔒';
            }

            const label = document.createElement('div');
            label.className = 'node-label';
            label.innerText = q.name;
            node.appendChild(label);

            container.appendChild(node);

            if (index < quests.length - 1) {
                const sep = document.createElement('div');
                sep.className = 'node-separator';
                container.appendChild(sep);
            }
        });
    }

    function renderArcanumGrid() {
        const grid = document.getElementById('cards-grid-container');
        if (!grid) return;
        grid.innerHTML = '';

        arcanumData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'arcanum-card';
            card.onclick = () => showModal(`${item.num}. ${item.name}`, item.desc, item.image);

            const img = document.createElement('img');
            img.src = item.image;
            img.onerror = function() { this.style.display = 'none'; };
            card.appendChild(img);

            const title = document.createElement('strong');
            title.style.fontSize = '13px';
            title.style.color = '#fff';
            title.innerText = item.name;
            card.appendChild(title);

            const tag = document.createElement('div');
            tag.className = 'arcanum-num-tag';
            tag.innerText = `Аркан ${item.num}`;
            card.appendChild(tag);

            grid.appendChild(card);
        });
    }

    function startQuest(id) {
        currentQuestId = id;
        const q = quests.find(item => item.id === id);

        document.getElementById('level-badge').innerText = `${q.num} Аркан`;
        document.getElementById('level-title').innerText = q.title;
        document.getElementById('level-text').innerText = q.text;

        const imgEl = document.getElementById('level-image');
        if (q.image) {
            imgEl.src = q.image;
            imgEl.style.display = 'block';
        } else {
            imgEl.style.display = 'none';
        }

        const optionsBox = document.getElementById('options-container');
        optionsBox.innerHTML = '';

        q.choices.forEach(c => {
            const btn = document.createElement('button');
            btn.className = 'btn-choice';
            btn.innerText = `${c.key}) ${c.text}`;
            btn.onclick = () => makeChoice(c, q);
            optionsBox.appendChild(btn);
        });

        switchMode('game-screen');
    }

    function makeChoice(choice, quest) {
        if (choice.isCorrect) {
            const rewardXP = quest.id >= 5 ? 20 : 15;
            userXP += rewardXP;
            document.getElementById('xp-count').innerText = userXP;

            const nextId = quest.id + 1;
            const nextQuest = quests.find(q => q.id === nextId);
            if (nextQuest) {
                nextQuest.unlocked = true;
                pendingNextQuest = nextQuest;
            } else {
                pendingNextQuest = null;
            }

            renderMapTree();
            showModal("✨ Мудрое решение!", choice.msg, quest.image);
        } else {
            pendingNextQuest = null;
            showModal("🔮 Тень сомнения", choice.msg, quest.image);
        }
    }

    function showModal(title, text, imageSrc = null) {
        const modal = document.getElementById('custom-modal');
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-text').innerText = text;

        const imgEl = document.getElementById('modal-image');
        if (imageSrc) {
            imgEl.src = imageSrc;
            imgEl.style.display = 'inline-block';
        } else {
            imgEl.style.display = 'none';
        }

        modal.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('custom-modal').style.display = 'none';

        if (document.getElementById('game-screen').classList.contains('active-screen')) {
            const quest = quests.find(q => q.id === currentQuestId);
            switchMode('menu-screen');

            const catText = document.getElementById('cat-menu-text');
            if (pendingNextQuest) {
                catText.innerText = `«Превосходно! Ты пробудил(а) ${quest.num} Аркан. Следующие врата (${pendingNextQuest.num}) открыты!»`;
            } else if (quest && quest.id === quests.length - 1) {
                catText.innerText = "«Потрясающе! Все тайны Арканов в нашей обители открыты твоей мудрости!»";
            }
        }
