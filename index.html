            choices: [

                { key: "B", text: "Зазолироваться от мира навсегда, оборвать связи и уехать жить в глушь.", isCorrect: false, msg: "⚠️ Бегство от социума из обиды — это теневая сторона Отшельника. Суть карты в ином." },
                { key: "C", text: "Принять эту тишину как подарок. Замедлиться, отойти от суеты и зажечь свой внутренний фонарь, чтобы переосмыслить ценности.", isCorrect: true, msg: "🕯️ Превосходно, Мастер! Отшельник уходит в себя не из-за слабости, а чтобы вернуться к людям со светом истинной мудрости. Все испытания пройдены! +25 к Силе!" }

    const arcanumData = [
        { num: "0", name: "Дурак", image: "fool.png", desc: "Аркан начала, доверия Вселенной и чистого листа. Символизирует смелость совершить шаг в неизвестное без страха перед ошибкой." },

        { num: "VI", name: "Влюбленные", image: "love.png", desc: "Аркан выбора сердца, дуальности и искренней гармонии. Напоминает, что истинный выбор всегда делается из любви, а не из страха." },
        { num: "VII", name: "Колесница", image: "chariot.png", desc: "Аркан триумфа воли и укрощения противоположностей. Дарует умение управлять своими эмоциями и уверенно вести жизнь к цели." },
        { num: "VIII", name: "Сила", image: "strength.png", desc: "Аркан мягкой душевной стойкости и укрощения страстей. Показывает, что истинная сила кроется в милосердии и принятии, а не в агрессии." },
        { num: "IX", name: "Отшельник", image: "hermit.png", desc: "Аркан глубокой мудрости и поисков внутреннего света. Призывает замедлиться, услышать тишину духа и найти ответы внутри себя." },
        { num: "XVI", name: "Башня", image: "tower.png", desc: "Аркан крушения ложных иллюзий и освобождения. Разрушает то, что отжило, ради постройки нового, искреннего фундамента." },
        { num: "XVIII", name: "Луна", image: "moon.png", desc: "Аркан подсознания, тайных страхов и тонкой интуиции. Учит проходить сквозь туман неизвестности и принимать свою Тень." }
    ];

    let userXP = 0;
    let currentQuestId = 0;
    let pendingNextQuest = null;

    window.onload = function() {
        renderMapTree();
        renderArcanumGrid();

        setTimeout(() => {
            const loadScreen = document.getElementById('loading-screen');
            loadScreen.style.transition = 'opacity 0.8s ease';
            loadScreen.style.opacity = '0';
            setTimeout(() => {
                loadScreen.classList.remove('active-screen');
                document.getElementById('menu-screen').classList.add('active-screen');
            }, 800);
        }, 3200);
    };

    function switchMode(targetScreenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById(targetScreenId).classList.add('active-screen');

        document.querySelectorAll('.btn-nav-mode').forEach(btn => {
            btn.classList.remove('active');
        });
        
        if (targetScreenId === 'menu-screen') {
            document.querySelectorAll('.btn-nav-mode:nth-child(1)').forEach(b => b.classList.add('active'));
        } else if (targetScreenId === 'arcanum-screen') {
            document.querySelectorAll('.btn-nav-mode:nth-child(2)').forEach(b => b.classList.add('active'));
        }
    }

    function renderMapTree() {
        const container = document.getElementById('map-tree');
        container.innerHTML = '';

        quests.forEach((q, index) => {
            const node = document.createElement('div');
            node.className = `path-node ${q.unlocked ? '' : 'locked'}`;
            
            if (q.unlocked) {
                node.innerText = q.num;
                node.onclick = () => startQuest(q.id);
            } else {
                node.innerText = '🔒';
            }

            const label = document.createElement('div');
            label.className = 'node-label';
            label.innerText = q.name;
            node.appendChild(label);

            container.appendChild(node);

            if (index < quests.length - 1) {
                const sep = document.createElement('div');
                sep.className = 'node-separator';
                container.appendChild(sep);
            }
        });
    }

    function renderArcanumGrid() {
        const grid = document.getElementById('cards-grid-container');
        grid.innerHTML = '';

        arcanumData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'arcanum-card';
            card.onclick = () => showCardDetails(item);

            const img = document.createElement('img');
            img.src = item.image;
            img.alt = item.name;
            
            img.onerror = function() {
                this.style.display = 'none';
                const fallback = document.createElement('div');
                fallback.className = 'arcanum-card-fallback';
                fallback.innerText = item.num;
                card.insertBefore(fallback, card.firstChild);
            };

            card.appendChild(img);

            const title = document.createElement('strong');
            title.style.fontSize = '13px';
            title.style.color = '#fff';
            title.innerText = item.name;
            card.appendChild(title);

            const tag = document.createElement('div');
            tag.className = 'arcanum-num-tag';
            tag.innerText = `Аркан ${item.num}`;
            card.appendChild(tag);

            grid.appendChild(card);
        });
    }

    function showCardDetails(item) {
        showModal(`${item.num}. ${item.name}`, item.desc, item.image);
    }

    function startQuest(id) {
        currentQuestId = id;
        const q = quests.find(item => item.id === id);

        document.getElementById('level-badge').innerText = `${q.num} Аркан`;
        document.getElementById('level-title').innerText = q.title;
        document.getElementById('level-text').innerText = q.text;

        const imgEl = document.getElementById('level-image');
        if (q.image) {
            imgEl.src = q.image;
            imgEl.style.display = 'block';
        } else {
            imgEl.style.display = 'none';
        }

        const optionsBox = document.getElementById('options-container');
        optionsBox.innerHTML = '';

        q.choices.forEach(c => {
            const btn = document.createElement('button');
            btn.className = 'btn-choice';
            btn.innerText = `${c.key}) ${c.text}`;
            btn.onclick = () => makeChoice(c, q);
            optionsBox.appendChild(btn);
        });

        goToScreen('game-screen');
    }

    function makeChoice(choice, quest) {
        if (choice.isCorrect) {
            const rewardXP = quest.id >= 5 ? 20 : 15;
            userXP += rewardXP;
            document.getElementById('xp-count').innerText = userXP;

            const nextId = quest.id + 1;
            const nextQuest = quests.find(q => q.id === nextId);
            if (nextQuest) {
                nextQuest.unlocked = true;
                pendingNextQuest = nextQuest;
            } else {
                pendingNextQuest = null;
            }

            renderMapTree();
            showModal("✨ Мудрое решение!", choice.msg, quest.image, true);
        } else {
            pendingNextQuest = null;
            showModal("🔮 Тень сомнения", choice.msg, quest.image, false);
        }
    }

    function showModal(title, text, imageSrc = null, isSuccess = true) {
        const modal = document.getElementById('custom-modal');
        const titleEl = document.getElementById('modal-title');
        const textEl = document.getElementById('modal-text');
        const imgEl = document.getElementById('modal-image');

        titleEl.innerText = title;
        textEl.innerText = text;

        if (imageSrc) {
            imgEl.src = imageSrc;
            imgEl.style.display = 'inline-block';
        } else {
            imgEl.style.display = 'none';
        }

        modal.style.display = 'flex';
    }

    function closeModal() {
        const modal = document.getElementById('custom-modal');
        modal.style.display = 'none';

        if (document.getElementById('game-screen').classList.contains('active-screen')) {
            const quest = quests.find(q => q.id === currentQuestId);
            goToScreen('menu-screen');

            const catText = document.getElementById('cat-menu-text');
            if (pendingNextQuest) {
                catText.innerText = `«Превосходно! Ты пробудил(а) ${quest.num} Аркан. Следующие врата (${pendingNextQuest.num}) теперь открыты!»`;
            } else if (quest && quest.id === quests.length - 1) {
                catText.innerText = "«Потрясающе! Все тайны Арканов в нашей обители открыты твоей мудрости!»";
            }
        }
    }

    function goToScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById(screenId).classList.add('active-screen');
    }
</script>
